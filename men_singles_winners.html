
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tournament Winners</title>
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; }

.dashboard {
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:30px;
    margin-bottom:30px;
}

.stat {
    background:#adb8fb;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    flex:1;
    min-width:180px;
    text-align:center;
}

.stat h3 {
    margin:0;
    font-size:28px;
}

.stat p {
    margin:8px 0 0 0;
    font-size:28px;
    font-weight:bold;
}

.card {
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    margin-bottom:20px;
    padding:16px;
}

.card h2 { margin-top:0; }

table {
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    table-layout: fixed;
}

th, td {
    padding:8px;
    border-bottom:1px solid #ddd;
    text-align:left;
    word-wrap: break-word;
}

th { background:#f0f0f0; }

th:nth-child(1), td:nth-child(1) { width: 30%; }
th:nth-child(2), td:nth-child(2) { width: 20%; }
th:nth-child(3), td:nth-child(3) { width: 50%; }
</style>
</head>
<body>
<div id="header-banner"></div>
