<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>British Tennis Forum search</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f2f5;
    font-family: system-ui, sans-serif;
  }

  .search-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    padding: 32px 40px;
    width: 90%;
    max-width: 480px;
  }

  .search-card h2 {
    margin: 0 0 20px;
    font-size: 1.1rem;
    color: #333;
    text-align: center;
  }

  .search-card input {
    width: 100%;
    padding: 12px 16px;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-card input:focus {
    border-color: #4a90d9;
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
  }

  .engine-buttons {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .engine-buttons button {
    flex: 1;
    padding: 10px 0;
    font-size: 0.85rem;
    font-weight: 500;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #f9f9f9;
    cursor: pointer;
    transition: all 0.2s;
  }

  .engine-buttons button:hover {
    background: #e8f0fe;
    border-color: #4a90d9;
    color: #4a90d9;
  }
</style>
</head>
<body>

<div class="search-card">
  <h2>Search the <a href=http://britishtennis.activeboard.com>British Tennis Forum</A></h2>
  
  <form id="searchForm" method="GET">
    <input type="text" name="q" placeholder="Search..." autofocus>
    <div class="engine-buttons">
      <button type="submit" data-engine="google">Google</button>
      <button type="submit" data-engine="duckduckgo">DuckDuckGo</button>
      <button type="submit" data-engine="bing">Bing</button>
      <button type="submit" data-engine="brave">Brave</button>
      <button type="submit" data-engine="yahoo">Yahoo</button>
    </div>
  </form>
</div>

<script>
  const SITE = 'britishtennis.activeboard.com';

  const ENGINES = {
    google:      'https://www.google.com/search?q=',
    duckduckgo:  'https://duckduckgo.com/?q=',
    bing:        'https://www.bing.com/search?q=',
    brave:       'https://search.brave.com/search?q=',
    yahoo:       'https://search.yahoo.com/search?q='
  };

  document.getElementById('searchForm').addEventListener('submit', function(e) {
    const engine = e.submitter.dataset.engine;
    const query = this.querySelector('input[name="q"]').value.trim() + ' site:' + SITE;

    e.preventDefault();
    window.location.href = ENGINES[engine] + encodeURIComponent(query);
  });
</script>   
</body>
</html>
